[package]
name = "evocam"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
anyhow = "1.0.100"
nokhwa = { version = "0.10.10", features = ["input-v4l"] }
evobridge = {path = "../evobridge/"}
evotypes-rs = {path = "../evotypes-rs/"}
image = "0.25.9"
exr = "1.74.0"
tokio = { version = "1.48.0", features = ["macros"] }
embedded-fps = { version = "0.1.0", features = ["std"] }
