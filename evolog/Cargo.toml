[package]
name = "evolog"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[dependencies]
anyhow = "1.0.100"
rerun = "0.28.1"
tokio = { version = "1.48.0", features = ["macros"] }
evobridge = {path = "../evobridge/"}
evotypes-rs = {path = "../evotypes-rs/"}
embedded-fps = { version = "0.1.0", features = ["std"] }
